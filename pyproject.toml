[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-scout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4", "Flask-SQLAlchemy>=3.1,<4", "Flask-Migrate>=4,<5",
  "Flask-WTF>=1.2,<2", "Flask-Limiter[redis]>=3.10,<5", "celery[redis]>=5.4,<6",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24", "python-dotenv>=1,<2", "email-validator>=2.2,<3",
  "tldextract>=5.1,<6", "sentry-sdk[flask]>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-flask>=1.3,<2", "ruff>=0.9", "mypy>=1.14", "pip-audit>=2.8", "playwright>=1.50", "types-beautifulsoup4", "types-requests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["flask_sqlalchemy.*", "flask_migrate.*", "flask_wtf.*", "celery.*", "tldextract.*"]
ignore_missing_imports = true
